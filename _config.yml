  - {file: "projects.md", title: Projects}
  - {file: "experience.md", title: Experiences}
  - {file: "leadership.md", title: Leadership}
  - {file: "skills.md", title: Skills}

external:                       # accepts {file, title, url, icon, sidebaricon}
  - {title: Github, icon: github, url: "https://github.com/aadib2"}
  - {title: LinkedIn, icon: linkedin, url: "https://www.linkedin.com/in/aadi-bery/"}

comments:
